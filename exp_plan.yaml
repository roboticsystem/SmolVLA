  - id: E14-dagger-detf
    name: HG-DAgger 复活（detf 设定，修正历史四混杂）
    status: proposed
    hypothesis: >
      旧 DAgger 负结果（§4.2，reactive 设定）含四个混杂：标签器与示范不同源
      （reactive 13.3% vs 误配 oracle）、训练步数未随数据量同比（0.42 epoch）、
      纠正数据占比 80%、旧协议 24 回合。在 ft_detf 设定（oracle 示范 96k、
      oracle 标签器同源、标准 200 回合协议、固定 10k 步预算）下重验：
      DAgger 纠正数据能否提升闭环 SR。
    variables:
      arm: ft_dagger_r1（nav_detf.h5 + DAgger round-1 纠正数据合并后重训）
      dagger_collect: {student: ft_detf, labeler: oracle(与示范同源), beta: 0.2,
                       exec_actions: 8, episodes: 200, seed: 7777,
                       不筛成败, calib}
      data: 合并集（≈96k + ~100-130k 样本）
      fixed: {steps: 10000, batch: 8, lr: 1e-4, chunk: 50, lora_r: 8}
      # 训练预算口径：固定 10k 步（与 ft_detf 同预算）。同 epoch 口径
      # （~22k 步）仅作负结果时的补充分析，不作为主检验。
    seeds: {train: 2026, eval: 9000}   # DAgger 采集 seed 7777，与评测回合不重叠
    endpoints:
      primary: SR（200 回合，seed 9000+37·ep，max_steps 200，calib）
      secondary: [SPL, NE]
    decision: >
      配对精确 McNemar vs ft_detf 明细（n=200），Holm 校正（族 m=1）显著更优
      → DAgger 有效，启动 round-2；无差异或更差 → 「固定预算下 DAgger 无效」
      结论升级到 detf 设定，关闭算法侧数据聚合路线。
    analysis: 配对精确 McNemar + Holm；参照 = ft_detf 同码新评 21.5%
      （单一参照，采集/训练/评测全链同码）。
    outcome: done 负结果（2026-10-31）。SR 10.50% [7.0,15.5]，SPL 0.096，
      NE 2.44，n=200。vs ft_detf 新评 +7/-29 p=0.0003 显著更差（ΔSR
      −11.0pp）。按登记关闭算法侧数据聚合路线。归因：与 resolve 负结果
      同模式——固定 10k 步预算下混入 ~25% 学生纠正数据（实际 121k 样本）
      稀释 oracle 曝光（<1 epoch），两次混数据实验均 −9~−11pp；修正了
      标签器/执行/占比/协议四混杂后仍负，指向预算口径混杂是主因。
      产物 export/ft_dagger_r1_eval.json、export/nav_dagger_r1.h5。

  - id: E15-bev-polar
    name: BEV 极坐标证据图（无真值显式方位通道，主攻线第一发）
    status: registered
    registered: 2026-11-01
    motivation: >
      E13/E13b 已证方位信息通道价值（特权真值 47.4±2.4%，+25.6pp
      5/5 种子显著）；E12 已证扁平 mem 8 维学不到（−9pp 显著更差）。
      差异假设：E12 把记忆压成单一 argmax 槽（无分布、无不确定性），
      模型无法学会「何时信记忆」。E15 输出证据的完整分布。
    hypothesis: >
      自我中心极坐标 BEV 证据图（12 方位 × 4 距离 = 48 维，世界坐标
      证据按当前位姿重投影 + 强度累积 + 指数衰减 + 距离膨胀涂抹）能把
      SR 从 21.5% 提升到 ≥30%（兑现 E13 上界 47.4% 的约 1/3~1/2）。
    variables:
      arm: ft_bev10k（同轨迹重提 nav_bev.h5 + 10k 步训练，协议同 E12/E13）
      feature: [tgt 4 维当前帧槽] ++ [bev 48 维证据网格] = 52 维
        （DET_DIM["bev"]=52；bev 网格编码**指令相关目标**证据，
        指令不指目标时 tgt=[0,0,0,0]，bev 为主要信号）
      memory: PolarBEV 类（与 TargetMemory 同接口 reset/update/query；
        差异：①strength 累积非指数平滑 ②无 TTL 硬截断改指数衰减
        ③输出 48 维分布非单点 ④距离>2m 条目在 r 向涂抹相邻 bin）
      fixed: {steps: 10000, batch: 8, lr: 1e-4, chunk: 50, seed: 2026,
              eval: 9000 标准协议, 数据轨迹与 E12/E13 完全相同}
    info_boundary: >
      非特权：证据全部来自「自车位姿（里程计）+ 相机检测方位/距离」，
      与真机可用信息一致；不含真值目标位置。位姿增量用仿真精确位姿
      差分（无漂移假设，真机部署留待后续）。
    endpoints:
      primary: SR（200 回合，seed 9000+37·ep，max_steps 200，calib）
      secondary: [SPL, NE, 失败分层 min_dsurf]
    decision: >
      配对精确 McNemar + Holm（族 m=2，双参照 = ft_detf 同码新评 21.5%
      与存储锚点 24.5%，与 E12/E13 同协议）。显著更优 → 扩 5 种子
      （E13b 同协议）+ 预登记消融 E15a（空证据图对照，应≈21.5%，
      验证 52 维本身无增益）/ E15b（argmax 单点 4 维替代 48 维分布，
      预期低于 E15，验证「分布 vs 单点」）；不显著或更差 → 记负结果
      关闭「自维护显式方位通道」路线，失败分层定位（证据质量 vs
      特征消费）。
    implementation:
      - sim/perception.py: PolarBEV 类（~50 行，复用 TargetMemory 世界
        投影/merge 骨架）+ target_features mode="bev" 分支（~10 行）+
        DET_DIM["bev"]=52
      - sim/gen_dataset.py: --det-features-mode bev（mem 同款三处，
        ~10 行）
      - smolvla_finetune_sim.py: closed_loop_sr_batch/closed_loop_sr 的
        memory 构造扩 bev（~8 行）；StateNorm 适配 52 维自动
      - scripts/eval_ft_models.py: 闭环 memory 构造扩 bev（~6 行）
      - 冒烟：2 回合采集 + 3 步训练 + 2 回合评测（含 step-0 quick eval
        防 NaN 回归）
    schedule: 代码+冒烟 ~1h；数据重生成 ~15min；训练 ~2h；评测 ~1.3h；
      全链约 5h（GPU 串行，当前空闲）
    outcome: done（2026-11-01，负结果）
      SR 8.50% [5.4,13.2]（n=200）SPL 0.078 NE 2.72 m。
      配对精确 McNemar+Holm（m=2）：vs 同码新评 21.5% +6/-32
      p_holm=2.43e-05（-13.0pp 显著更差）；vs 存储锚点 24.5%
      p_holm=3.71e-07（-16.0pp 显著更差）。
      失败分层（失败=183）：min_dsurf 12/21/44/106（<0.45/0.45-0.7/
      0.7-1.5/>1.5），从未检出占失败 0%（ft_detf 锚点为 49/200=24.5%）。
      归因：证据质量已不是瓶颈（时间积分后目标几乎总能进记忆），
      败在特征消费——48 维稀疏网格（非零率 ~5%）在 1232 回合/10k 步
      下学不出「何时信记忆」，且训练期记忆由教师轨迹重放构造、
      评测期由学生自身复合误差构造，分布漂移进一步破坏策略。
      按预登记决策：记负结果，关闭「自维护显式方位通道」路线；
      E15a/E15b 消融不再执行。

  - id: AUDIT-2026-11-01
    name: 数据配方审计（E12-E15 登记口径修正，不改动原登记正文）
    status: done
    finding: |
      逐库核对 h5 attrs 发现三处登记与实际不符：
      ① nav_detf.h5（ft_detf 基线 21.5%/24.5% 的训练数据）attrs
         policy=sweep_det（1080 回合 seed 0 var 3 ms 200），而 E12/E13/E14
         登记均写作「oracle 示范 96k」；
      ② E12/E13 登记称重生成「1080 回合」，实际 nav_detfM/G.h5 为 1232 回合
         （oracle, seed 2026, var 2, ms 700）——与 nav_detf.h5 **不同示范策略
         不同配方**，「同分布不同 rollout」表述不成立；
      ③ E14 采集脚本标签器用了默认 expert=sweep（登记写 oracle），且 sweep 与
         sweep_det 亦非同源。
    implication: |
      E12/E13/E15 各臂（oracle 数据）对 ft_detf 基线（sweep_det 数据）的
      配对差值 = 特征效应 δ_data（示范策略/配方效应）之混叠。E13 的 +26pp
      不能全部归因 gt 特征；E12 的 −9pp 中 mem 特征效应可能被配方差掩盖
      （旁证：§4.23 旧配方上 mem +7.75pp n=400）。oracle 自身 ω 饱和噪声
      （79.6% 步饱和，oracle_smooth 的立项动机）提示 δ_data 方向不明。
    action: 登记 E17-recipe-delta 直接测量 δ_data；此后跨配方比较一律
      报告 δ 分解。E12/E13/E14/E15 原登记正文保留不改（预登记完整性）。

