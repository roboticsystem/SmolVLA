      McNemar + Holm（m=2）：vs ft_detf 同码新评 21.5% ΔSR=−7.50pp
      （+14/−29）p_holm=0.0315 显著；vs 存储锚点 24.5% ΔSR=−10.50pp
      （+12/−33）p_holm=0.00492 显著。**δ_data 方向证实为负：oracle 配方
