    registered: 2026-11-01
    motivation: AUDIT-2026-11-01。同轨迹同配方只换特征档位，才能把 E13 的
      +26pp 分解为「gt 特征效应 + δ_data」。
    hypothesis: δ_data ≠ 0（方向未知）。若 δ_data < 0（oracle 配方更差），
      E12 mem 负结果部分为配方效应所致，gt 真实效应大于 +26pp。
    variables:
