  - id: E16-feat-homology
    name: 特征同源 DAgger（mem 8 维 × 学生状态分布，H1 分布漂移检验）
    status: registered
    registered: 2026-11-01
    motivation: |
      E12/E15 归因主假设 H1：mem/bev 特征是**学生行为历史的函数**，
      训练期（教师轨迹重放）与评测期（学生自身复合误差）分布漂移，
      而 E13 gt 特征是「当前位姿+目标」的确定函数（行为无关）所以能学。
      旁证：E12 8 维稠密 argmax 也失败 → 稀疏性/表示复杂度非主因；
      §4.23 旧配方 mem +7.75pp → mem 特征并非天然不可用。
      E16 把训练特征改到学生状态分布上计算（DAgger 同源），直接检验 H1。
    hypothesis: >
      特征同源后 mem 8 维通道可用：SR 显著高于 E12（15.5%）且不显著低于
      双参照，达到 ≥25%（若 H1 是全部原因应接近 §4.23 水平 ~29%+）。
    variables:
      arm: ft_memdag10k（纯 DAgger 数据，不与教师数据合并——E14 教训：
        固定预算下混入第二数据源必稀释；纯替换保持单一来源 ~0.8 epoch）
      dagger_collect: {student: ft_detf(deliver_v1), labeler: oracle(显式,
        修正 E14 的 sweep 误用), beta: 0.2, exec_actions: 8,
        episodes: 300, seed: 7777, 不筛成败, calib, max_steps: 200,
        instr_variants: 2}
      feature: mem 8 维，**沿学生轨迹逐表述重放** TargetMemory(ttl=25)
        （与 gen_dataset 同一重放逻辑；p0 表述的特征与学生实际消费的
        完全同源）
      fixed: {steps: 10000, batch: 8, lr: 1e-4, chunk: 50, lora_r: 8,
              train_seed: 2026}
    info_boundary: >
      特征仍非特权：mem 来自学生自己的检测流+里程计（β=0.2 步由 oracle
      动作推进环境，但检测/记忆仍全部来自非特权观测流）。标签动作来自
      特权 oracle（DAgger 标准做法，标签不进入推理期）。
    known_limitation: >
      轮次一近似：评测期记忆由**新模型自身**行为构造，与训练期
      （ft_detf 行为 + 20% oracle 介入）仍非完全同源；若方向证实，
      后续轮次用本轮产物做 student 逼近完全同源。
    endpoints:
      primary: SR（200 回合，seed 9000+37·ep，max_steps 200，calib）
      secondary: [SPL, NE, 失败分层 min_dsurf, ever_found]
    analysis: 配对精确 McNemar + Holm（族 m=3：vs E12 明细 15.5%——
      主比较，同特征档位；vs 新评 21.5% 与锚点 24.5%——路线复活线）。
    decision: >
      E16 显著优于 E12 且不显著劣于双参照 → H1 证实，mem 路线复活
      （登记 round-2 完全同源 + 评估 bev 同源版必要性）；
      显著优于 E12 但仍显著劣于参照 → 部分恢复，报告分解后决定是否
      round-2；不优于 E12 → H1 不成立或非主因，「历史依赖特征」路线
      （含 bev 同源）整体关闭，主攻侧转向 δ_data 分解后的数据配方线。
    outcome: >
      已完成（2026-11-01 21:36，export/ft_memdag10k_eval.md）：
      SR 8.50% [5.4,13.2] SPL 0.083 NE 2.43（n=200）。采集 stats
      （nav_memdag_r1.h5.stats.json）：91036 样本 / 592 段，采集期
      student SR 42.9%（β=0.2 混合口径），expert 介入率 20.1%。
      配对精确 McNemar + Holm（m=3）：主比较 vs E12 15.5%
      ΔSR=−7.00pp（+9/−23）p_holm=0.0201 **显著更差**；vs 新评 21.5%
      −13.0pp p_holm=2.58e-05；vs 锚点 24.5% −16.0pp p_holm=2.83e-06。
      **按预登记决策：H1 不成立或非主因 —— 「历史依赖特征」路线
      （含 bev 同源）整体关闭，主攻转向数据配方线。**
      注：特征同源非但未复活 mem 反而更差，与 E14（固定预算混学生数据
      稀释）同模式 —— DAgger 侧修复分布漂移的两次尝试均负，归因建议
      以「预算/配方结构」为主因，H1（分布漂移）降级为次要因素。

  - id: E18-gt-sweepdet
    name: gt 特征 × sweep_det 配方（配方修正后的真实上界重测）
    status: registered
    registered: 2026-11-01
    motivation: |
      E17 证实 δ_data<0（oracle 配方显著劣于 sweep_det，−7.5~−10.5pp），
      而 E13 的 gt 上界 47.5% 恰是在更差的 oracle 配方上测的 —— 真实上界
      可能被低估。E16/E17 关闭「历史依赖特征」路线后，数据配方线的第一项
      是把标尺修正：sweep_det 配方（当前更优基线配方）× gt 特征。
      附带得到同配方下的纯特征效应（E18 vs ft_detf 双参照），补齐
      E13 因配方混杂而缺失的干净对照。
    design_note: >
      同轨迹重算不可行：探针复刻 shard 0（seed 7919 × 68 回合）与
      nav_detf.h5 逐位不一致（生成后代码路径已漂移：68 回合仅保留 56，
      采样数不同），且 nav_detf.h5 未存每回合 goal，事后重算无依据。
      故采用与 E13 完全同构的设计：同配方同种子重生成 = 不同 rollout
      （nav_detfG 之于 nav_detf 亦如此）；配对检验在评测回合上做，
      不受训练侧 rollout 差异影响。
    hypothesis: >
      gt 特征效应被 oracle 配方低估：E18（sweep_det 配方 × gt）显著高于
      E13（oracle 配方 × gt）47.5%，真实上界 >50%。
      若不高于 E13（等价或更低）→ gt 上界 ~47.5% 对配方稳健，
      δ_data 主要作用于可学特征臂而非特权上界。
    variables:
      features: [gt 4 维]      # det_feat 同构替换 [1, sin a, cos a, dist/12]，特权真值
      data: nav_gtSW.h5（sweep_det 配方重生成：policy=sweep_det, seed 0,
            1080 回合, instr_variants 3, max_steps 200, calib,
            det_mode=gt，成功回合过滤与退化过滤同现行代码）
      fixed: {steps: 10000, batch: 8, lr: 1e-4, chunk: 50, lora_r: 8,
              train_seed: 2026}
    endpoints:
      primary: SR（200 回合，seed 9000+37·ep，max_steps 200，calib）
      secondary: [SPL, NE, 失败分层 min_dsurf]
    analysis: 配对精确 McNemar + Holm（族 m=3：主比较 vs E13
      ft_gcond10k 47.5%——同特征跨配方；vs ft_detf 新评 21.5% 与
      存储锚点 24.5%——同配方跨特征）。跨配方比较附 δ 分解口径。
    decision: >
      显著高于 E13 → 配方效应在上界臂同样成立，真实上界按 E18 修正，
      「无真值方位通道」路线天花板抬高，后续增益按新标尺度量；
      不高于 E13 → gt 上界 ~47.5% 稳健，配方效应仅作用于可学特征臂，
      报告为「特权上界配方稳健」。
    outcome: >
      已完成（2026-11-02 00:32，export/ft_gtSW10k_eval.md）：
      **SR 21.00% [15.9, 27.2]**（SPL 0.207，n=200）。走预登记第二分支
      （不高于 E13），但方向比预登记措辞更强——不是等价而是**显著更低**：
      vs E13 47.5% **−26.50pp**（+7/−60，p_holm=3.98e-11 *）；
      vs ft_detf 新评 21.5% −0.50pp（p_holm=1，等价）；
      vs 锚点 24.5% −3.50pp（p_holm=0.698，n.s.）。
      **配方 × 特征 2×2 补齐**：det×sweep 21.5 / det×oracle 14.0（E17）/
      gt×oracle 47.5（E13）/ gt×sweep 21.0（E18）——对角（示范信息通道=学生
      通道）显著高于非对角，且信息越丰富对角差距越大。
      **新原则：示范-学生信息一致性**——特征增益兑现的条件是
      「示范策略实际使用的信息 ⊆ 学生特征通道」；E17/E18 两次 δ 符号相反
      （det 臂 −7.5pp / gt 臂 −26.5pp）即混叠的镜像证据。
      结论修正：47.5% 应表述为 **oracle 策略模仿上界（配方/通道专属）**，
      而非「gt 信息的一般上界」；可部署路线的现实天花板仍为锚点 ~24.5%。
      下一步指向：改学生通道与示范配方**同通道**重生成（E15/E16 败因的
      统一解释），而非单改配方或单改特征。

  - id: E19-homochannel
    name: 示范同源通道（tgt+mem+稠密方位剖面 20 维 × sweep_det 同轨迹）
    status: registered
    registered: 2026-11-02
    motivation: |
      E18 确立「示范-学生信息一致性」原则：特征增益兑现的条件是
      示范策略实际使用的信息 ⊆ 学生特征通道。sweep_det 示范策略的动作是
      「当前帧检测 + 跨帧记忆（mem_ttl=25，实测值 17pp）」的函数，而
      ft_detf 学生只看单帧 4 维槽 → 记忆依赖的动作对学生是一对多映射。
      E12（mem 8 维）在 oracle 配方上测过该通道（15.5%，δ 分解后 ≈+1.5pp），
      但 E18 证明 δ_data 特征依赖（det 臂 −7.5 / gt 臂 −26.5 符号相反），
      mem 臂在 sweep_det 配方（当前更优基线配方）上从未测过。
      E15 败因 = 48 维稀疏网格消费失败；E16 败因 = DAgger 预算/稀释
      （其 outcome 亦建议归因以配方结构为主因）。E19 按 E18 指向把
      两侧一起改：学生通道覆盖示范实际信息，且特征沿**示范自身轨迹**
      重放（训练期特征 = 示范策略实际依赖的同源信息）。
    design_note: >
      不重跑仿真：nav_gtSW.h5（E18 轨迹库，sweep_det/seed 0/1080 回合/
      var 3/ms 200/calib）的示范 rollout 与过滤完全保留，仅把 det_feat
      换成 homo 20 维（扩展 repair_det_features 逐段记忆重放重算）。
      因此与 E18 严格同数据同配方同轨迹，唯一差异是学生通道 ——
      E19 vs E18 构成「同通道 vs 特权通道」的干净配对。
      通道形态：tgt 槽 4 维（单帧，与 det 完全同路）+ mem 槽 4 维
      （TargetMemory(ttl=25) 查询，与示范策略 _from_memory 同机制同参数）
      + 稠密方位剖面 12 维（12×30° bins；当前帧匹配检测强度 1.0，
      记忆条目强度 0.9·0.97^age；软类别匹配与 match/_from_memory 一致）
      = 20 维稠密向量（E15 的「分布」思想以低维稠密形式回归；
      E15 的稀疏 48 网格与 E16 的学生轨迹重放均规避）。
      备用消融：h5 前 8 列即 mem 8 维同轨迹数据，切片即可补
      「argmax 槽 vs 分布」消融，无需重新检测。
    hypothesis: >
      同通道后示范的记忆依赖动作可学：SR 显著高于双参照，点估计 ≥28%
      （≈示范策略自身采纳率 301/1080 口径）。若仅与 ft_detf 等价，
      说明记忆槽在 sweep 配方上仍学不出（评测期记忆由学生轨迹构造、
      训练期由教师轨迹重放的残余漂移，或特征消费瓶颈），一致性原则
      对「历史依赖成分」不成立。
    variables:
      arm: ft_homoSW10k（nav_homoSW.h5 = nav_gtSW.h5 同轨迹重提 homo 20 维
           det_feat；训练协议与 E18 完全一致）
      feature: [tgt 4] ++ [mem 4] ++ [方位剖面 12] = 20 维（DET_DIM["homo"]=20）
      fixed: {steps: 10000, batch: 8, lr: 1e-4, chunk: 50, lora_r: 8,
              train_seed: 2026, 数据轨迹 = E18 nav_gtSW 同一轨迹库}
    info_boundary: >
      非特权：mem 与剖面全部来自「学生可见的检测流 + 里程计位姿」沿示范
      轨迹的重放，与真机可用信息一致；不含真值目标位置（E18 同轨迹库
      原样保留，其 gt 特征列不进入本臂训练）。
    endpoints:
      primary: SR（200 回合，seed 9000+37·ep，max_steps 200，calib）
      secondary: [SPL, NE, 失败分层 min_dsurf, ever_found]
    analysis: 配对精确 McNemar + Holm（族 m=3：主比较 vs ft_detf 同码新评
      21.5%——同配方跨特征；存储锚点 24.5%；E12 mem×oracle 15.5%——
      同通道跨配方）。跨配方比较附 δ 分解口径。
    decision: >
      显著高于双参照 → 一致性原则在可部署通道兑现，扩 5 种子（E13b 协议）
      并把 homo 通道定为新主线；显著高于 21.5% 但不高于锚点 → 部分兑现，
      报告 δ 分解与 mem8 切片消融必要性；不高于 21.5% → 同通道重生成
      不兑现，归因（残余分布漂移 vs 特征消费），「显式方位通道」路线
      整体关闭，主线收敛到示范配方工程（δ_data=−7.5pp 方向）。
